{{ $posts := site.GetPage "/posts" }}
<div class="post-list">
{{ range $posts.Pages.GroupByDate "2006" }}
<table>
  <tr>
    <th />
    <th>
      ~~~~~ {{ .Key }}
    </th>
  </tr>
  {{ range .Pages }}
  <tr>
    <td><a href="{{ .Permalink }}">{{ .Title }}</a></td>
    <td>
    <time datetime="{{ .Date | time.Format "2006-01-02" }}">
      {{- .Date | time.Format "January 2" -}}
    </time>
    </td>
  </tr>
  {{ end }}
</table>
{{ end }}
</div>
